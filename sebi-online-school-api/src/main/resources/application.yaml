spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3308/sebi_school_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    naming:
      physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8083
  error:
    include-stacktrace: never

application:
  jwt:
    tokenPrefix: "Bearer"
    tokenExpirationAfterDays: 7
    # Fara default: aplicatia nu porneste fara JWT_SECRET_KEY (vezi .env.example).
    secretKey: ${JWT_SECRET_KEY}